name: Deploy Clickknight to GitHub Pages

on:
  push:
    branches:
      - main    # or your default branch (adjust if you use “master” or another)

permissions:
  contents: write   # allow push by the Actions bot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'   # or whichever Node version you use

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build    # or your custom build command (e.g. `npm run build:prod`)

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build   # if your build folder is different, change this
